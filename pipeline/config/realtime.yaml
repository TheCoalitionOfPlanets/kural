# Real-time speech -> reasoning -> speech pipeline.
#
# Each stage runs as a subprocess in its own venv (the three model stacks have
# mutually incompatible transformers pins), speaking JSON-lines over stdin/stdout.

capture:
  device: default          # null/default = system default input
  sample_rate: 16000
  frame_ms: 20
  vad:
    backend: webrtc        # webrtc | energy  (webrtc needs the webrtcvad package)
    aggressiveness: 2      # webrtc only, 0-3; raise in noisy rooms
    calibration_s: 1.0     # noise-floor sampling at startup
    noise_margin: 6.0      # energy gate: threshold = noise_floor * margin
    min_threshold: 0.015   # absolute floor, so a quiet room cannot self-trigger
    silence_ms: 600
    min_utterance_ms: 300
    max_utterance_ms: 15000
    pre_roll_ms: 300
    # -- barge-in gate: applies only while the speakers are audible ----------
    # Bleed is voiced audio, so the VAD is right to call it speech. The only
    # acoustic levers are demanding it be louder and demanding it be sustained.
    # An interrupt is final — the reply is never resumed — so these are the
    # defence against the assistant's own voice cutting it off. Raise them if
    # replies stop on their own.
    barge_in_aggressiveness: 3      # webrtc only; strict VAD while audible
    barge_in_energy_multiplier: 2.5 # energy threshold x this while audible
    barge_in_debounce_ms: 240       # consecutive speech needed to interrupt
    barge_in_grace_ms: 350          # ignore speech this soon after audio begins
    # Discard mic frames for this long after the speakers go silent. Stopping
    # playback does not stop the room — speakers and reverb ring on, and that
    # ring must not be recorded as the start of the user's turn. Skipped
    # mid-utterance, where the audio is the user who caused the interrupt.
    post_playback_deafen_ms: 250

queues:
  audio_queue:       { maxsize: 8,  on_full: drop_oldest }
  transcript_queue:  { maxsize: 32, on_full: block }
  reply_queue:       { maxsize: 32, on_full: block }
  wav_queue:         { maxsize: 8,  on_full: block }

stt:
  python: venv/Scripts/python.exe          # root venv
  worker: pipeline/workers/worker_stt.py
  model_dir: stt/models
  device: cuda
  require_cuda: true
  # -- the language gate ---------------------------------------------------
  # SraVaani is an Indic ASR. Given Spanish it does not fail — it returns
  # confident Devanagari gibberish — so the transcript cannot be used to notice
  # that it should never have been made. The decision has to come from the
  # waveform, before transcription, which is what this is: one small forward
  # pass that picks the ear.
  #
  #   indic / english  ->  SraVaani, locally, free
  #   anything else    ->  ElevenLabs Scribe (see the elevenlabs section)
  #
  # With the model missing or enabled: false, every turn routes locally and the
  # pipeline behaves exactly as it did before this path existed.
  lid:
    enabled: true
    model_dir: stt/models/mms-lid-126
    # mms-lid-126 is a 966M-parameter wav2vec2 — bigger than the ASR it gates
    # for, and it only ever picks a language. float32 costs 3.69 GB, float16
    # costs 1.86 GB, and the predictions are the same to three decimals on
    # every case tested (clean English, Tamil, Gujarati, a 1.8s fragment, a
    # borderline Hindi/English code-mix, and noise). Nothing here needs the
    # extra precision: the output is an argmax and a probability sum.
    dtype: float16
    # Below this the prediction is not trusted and the turn stays local.
    # Failing toward local is deliberate: a wrong local route costs one bad
    # transcript, a wrong international route costs an API call — and on a
    # mostly-Indic pipeline the ambiguous turns are mostly Indic. Raise it to
    # spend less; lower it if international speech is being missed.
    min_confidence: 0.55
    # The main defence against English being sent abroad. Only 15 of MMS-LID's
    # 126 labels are local, so the top-1 label is structurally biased toward
    # leaving: English that splits its mass across `eng`, `cym` and `nno` can
    # top out on a foreign label while local is still right by a wide margin.
    # This sums the probability over *all* local labels and keeps the turn home
    # when that total clears the bar, whatever the argmax said.
    #
    # Well below half on purpose — the question is not "is this certainly a
    # local language" but "is there real reason to spend an API call". Raise it
    # if foreign speech is being kept local; lower it if English still leaves.
    min_local_mass: 0.30
    # LID on a fragment is a coin flip, and short turns ("yes", "mm", "wait")
    # are overwhelmingly in the language already being spoken.
    min_audio_s: 0.7
    # LID needs a few seconds, not the whole turn. Capping keeps a 15s
    # utterance as cheap to classify as a 3s one.
    max_audio_s: 5.0
    # Hysteresis: once someone is speaking Spanish they keep speaking Spanish,
    # and one dip below min_confidence should not drop them onto an ear that
    # cannot hear them. This only ever confirms a low-confidence prediction
    # that already agrees with the previous turn — it can never override a
    # confident one, so switching back to Tamil still takes effect on the very
    # next sentence. 0 disables it.
    sticky_ttl_s: 60
    # Above this, the detected language is passed to Scribe as a hint. Below
    # it Scribe detects on its own, since a confident wrong hint is worse than
    # none — and Scribe's answer is what the rest of the turn runs on either
    # way.
    hint_confidence: 0.85

llm:
  python: reasoning/venv/Scripts/python.exe
  worker: pipeline/workers/worker_llm.py
  model_dir: reasoning/models/gemma-3-4b-it
  device: cuda
  require_cuda: true
  load_in_4bit: true       # ~3GB instead of ~8GB, so all three models fit in 12GB
  # The prompt asks for short replies; this decides. Every token here is also
  # ~0.5s of TTS synthesis, so it is the main latency lever too.
  max_new_tokens: 96
  temperature: 0.6         # lower than default for steadier instruction-following
  prompt_file: pipeline/config/prompts/voice_assistant.md
  # Reply in the language the user spoke. The prompt asks for this; a 4B model
  # ignores it under load, so the language is detected from the transcript and
  # stated to the model explicitly each turn. Switching language also clears
  # history, since prior turns pull the reply back to the old language.
  enforce_language: true
  history_turns: 4         # conversation turns kept as context (0 = stateless)
  history_ttl_s: 300       # clear history this long after the last exchange (0 = never)

tts:
  python: tts/venv/Scripts/python.exe
  worker: pipeline/workers/worker_tts.py
  # Indic-Mio is a 0.6B causal LM — small enough to sit on the same card as
  # STT and the LLM, and autoregressive generation on CPU would be far slower
  # than Piper's non-autoregressive VITS ever was.
  device: cuda:0
  require_cuda: true
  model_dir: tts/models/Indic-Mio
  # MUST be the codec Indic-Mio was trained with — its model card names
  # MioCodec-25Hz-24kHz. The audio tokens index this codec's codebook, so
  # decoding them with the 44.1kHz codec does not fail, it just produces
  # fluent, correctly-timed, completely wrong speech that sounds like the
  # assistant answering in another language.
  codec_dir: tts/models/MioCodec-25Hz-24kHz
  # -- the voice ----------------------------------------------------------
  # Indic-Mio clones zero-shot from a reference clip. Without one it invents a
  # speaker per utterance at temperature 0.9, so every reply sounds like a
  # different person. This clip is encoded once at startup and conditions every
  # synthesis, which is what pins the assistant to a single voice.
  #
  # Must be 16-bit mono WAV. A few seconds of clean, neutral speech is enough;
  # emotion-tagged or whispered audio is cloned faithfully, tone included, so
  # the reference should sound the way the assistant should sound.
  #
  # This is also the file to upload to ElevenLabs Instant Voice Cloning — the
  # same reference on both stacks is what keeps the local and international
  # voices recognizably the same speaker. See docs/voice.md.
  reference_wav: tts/voice/reference.wav
  # Generation knobs, straight from the model card. Every extra token here is
  # also more synthesis latency, same as the LLM's max_new_tokens.
  max_new_tokens: 1024
  temperature: 0.9
  top_p: 0.9
  # Echo reduction layer 1. The feedback loop is acoustic, so amplitude is the
  # most effective software lever. If replies are too quiet, raise the *system*
  # volume — a quiet signal amplified downstream keeps a better
  # speaker-to-mic ratio than a hot signal does.
  normalize:
    target_lufs: -23.0     # null to disable; -16 is typical streaming loudness
    peak: 0.7              # hard ceiling after loudness normalization

elevenlabs:
  # The international ear and voice. Read by two workers — STT and TTS — from
  # this one section, so the two halves of the path cannot drift apart.
  #
  # WHICH TURNS COME HERE is not configured: it is whatever the local models
  # cannot handle. SraVaani hears the scheduled Indian languages plus English
  # and Indic-Mio speaks the same set, so that set is "local" and its
  # complement is "international" (pipeline/realtime/languages.py, LOCAL).
  # Speak Tamil and nothing below is touched; speak Spanish and it all is.
  enabled: true
  # The key is read from the environment, never from this file — config is
  # committed, keys are not. Unset means the international path is unavailable,
  # which is reported at startup and per-turn rather than failing silently.
  api_key_env: ELEVENLABS_API_KEY

  # Scribe is ElevenLabs' only speech-to-text model. It detects the language
  # itself, and its answer outranks the local LID gate's — which is how a
  # misrouted turn repairs itself: LID says Spanish, Scribe says Tamil, and the
  # reply comes back in the local voice.
  stt_model: scribe_v1

  # eleven_multilingual_v2: 29 languages, the highest-quality tier. The
  # flash/turbo v2.5 models cut roughly a second off each reply if the latency
  # matters more than the voice does.
  tts_model: eleven_multilingual_v2
  voice_id: 21m00Tcm4TlvDq8ikWAM   # Rachel — a stock voice on every account
  # Raw PCM, not MP3: nothing in this pipeline can decode a compressed stream,
  # and the reply has to reach the loudness normalizer as samples. pcm_44100
  # needs a Pro subscription; 24kHz is plenty for speech through one speaker.
  output_format: pcm_24000
  voice_settings:
    stability: 0.5
    similarity_boost: 0.75

  # Every retry is silence the user is sitting through, so this is deliberately
  # low. Only rate limits, 5xx and transport failures are retried — a bad key
  # or a bad request returns the same answer however many times it is asked.
  retries: 1
  timeout_s: 20            # per call; stt_timeout_s / tts_timeout_s override

barge_in:
  # Let the user interrupt a reply in progress. Requires echo.guard: the mic
  # stays live during playback, so the text guard is the only thing standing
  # between speaker bleed and a self-interrupt.
  #
  # Two tiers, because the two halves of the decision have different deadlines:
  #   tier 1  sustained speech over the strict VAD gate stops playback in
  #           ~240ms. Fast, and cannot tell the user from our own speakers.
  #   tier 2  STT + the echo guard rule on that utterance ~1-2s later:
  #             real speech -> utterance goes to the model, queues flushed
  #             own echo    -> utterance discarded
  #
  # Stopping is FINAL: audio never resumes once interrupted. So the reply cannot
  # be re-triggered by its own bleed, and the tier-1 gate above is what has to
  # keep the assistant from cutting itself off.
  enabled: true
  # Longest wait for a tier-2 verdict. The utterance still has to close
  # (capture.vad.silence_ms) and be transcribed, so this must exceed
  # silence_ms + worst-case STT latency. On expiry the utterance is discarded.
  verdict_timeout_ms: 6000

echo:
  # Layer 2: drop mic frames entirely while the assistant is audible. Airtight
  # against self-hearing; the cost is that you cannot interrupt mid-reply.
  # Ignored when barge_in.enabled — an interruptible mic cannot be a muted one.
  mute_capture_while_replying: true
  mute_tail_ms: 400        # speakers and room reverb ring on past the last sample
  # Layer 5: the only layer that identifies echo rather than reducing its odds.
  # Catches bleed that survives muting (e.g. a reply still ringing at unmute).
  guard: true
  threshold: 0.6           # word-overlap fraction. Lower = more aggressive.
  window: 6                # recent replies compared against
  # Entries older than this are dropped: a reply that finished playing long ago
  # is not audible and cannot be bleeding, so keeping it only blocks later user
  # speech that happens to reuse the same words. Must comfortably exceed the
  # longest reply's playback time. 0 disables expiry.
  ttl_s: 30
  # A shared run of this many words in the same order counts as echo on its own,
  # regardless of the overlap fraction. Word order is evidence that plain
  # containment discards, and bleed arrives as a contiguous fragment of a reply.
  # Lower = more aggressive; below ~4 real speech starts matching by chance.
  ngram: 5
  # Layer 6: the same *input* arriving twice. Distinct from everything above,
  # which watches for the assistant's replies coming back. This catches a user
  # turn the pipeline already accepted being fed in again, which no reply
  # window can see — the text never was a reply.
  input:
    guard: true
    # Word-level similarity over both texts, not the containment fraction used
    # above: a re-fed input is the whole utterance again, differing only by STT
    # jitter, where reply bleed is a short fragment of something long. Lower =
    # more aggressive; below ~0.8 a user rephrasing the same request starts
    # being suppressed.
    threshold: 0.85
    window: 4              # recent accepted turns compared against
    # Deliberately shorter than the reply ttl_s above. A repeat is only echo
    # while the original turn is still in flight; past that, someone saying
    # "yes please" twice is a person saying it twice, and suppressing it leaves
    # them unable to repeat a request that was mis-heard.
    ttl_s: 20

playback:
  device: default
  keep_wavs: false

server:
  # The WebSocket front end (pipeline/server/app.py), for the Next.js app in
  # web/. The browser becomes the microphone and the speakers; everything
  # between them — VAD, barge-in, the echo guard, the language gate — is the
  # same code the terminal pipeline runs.
  host: 127.0.0.1        # 0.0.0.0 to reach it from another device on the LAN
  port: 8000
  # Which origins may call /health. WebSockets are not subject to CORS, but
  # /health is what the UI polls to decide whether its start button works — so
  # a too-narrow list here shows up as a permanent "Server offline" in front of
  # a perfectly healthy server.
  #
  # Left unset, any loopback origin on any port is allowed, because the dev
  # port is not knowable: Next moves to another one whenever 3000 is taken.
  # Set an explicit list when the server is exposed beyond this machine.
  # allow_origins:
  #   - https://voice.example.com

runtime:
  spill_dir: pipeline/spill
  log_latency: true
  startup_timeout_s: 300   # per worker; first load compiles/quantizes and is slow
